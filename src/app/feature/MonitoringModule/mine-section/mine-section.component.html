<ng-container *ngIf="mineData | async as mine">
    <ng-container *ngFor="let section of mine.mine.sections">
        <mat-card class="card">
          <mat-card-title>{{ section.name }}</mat-card-title>
          <mat-card-subtitle>Начальник: {{ section.boss }}</mat-card-subtitle>
          <mat-card-actions>
            <button mat-button [routerLink]="'monitoring/sections/combine'">Перейти</button>
          </mat-card-actions>
        </mat-card>
      </ng-container>
</ng-container>
