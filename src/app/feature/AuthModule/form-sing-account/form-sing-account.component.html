<div class="container-new-account">
    <mat-card class="register-card">
        <h1>Войти учетную запись</h1>
        <form class="register-form-field" [formGroup]="registrationForm" (ngSubmit)="singUpAccount()">
            <mat-card-content class="register-cardcontent">
                <mat-form-field class="register-form-field">
                    <mat-label class="register-formlabel">Логин</mat-label>
                    <input matInput class="register-form-input" formControlName="login" placeholder="Введите логин">
                    <mat-hint class="register-form-hint"
                        *ngIf="registrationForm.controls['login'].invalid && registrationForm.controls['login'].touched">Логин
                        обязателено</mat-hint>
                </mat-form-field>
                <mat-form-field class="register-form-field">
                    <mat-label class="register-formlabel">Пароль</mat-label>
                    <input matInput class="register-forminput" formControlName="password" [type]="hide ? 'password' : 'text'"
                        placeholder="Введите пароль">
                    <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                        <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                    <mat-hint class="register-form-hint"
                        *ngIf="registrationForm.controls['password'].invalid && registrationForm.controls['password'].touched">Пароль
                        обязателено</mat-hint>
                </mat-form-field>
            </mat-card-content>
            <div class="button-container">
                <button mat-flat-button class="register-form__button" color="accent" (click)="transition()">Создать учетную запись</button>
                <button 
                    mat-flat-button 
                    type="submit"
                    [disabled]="!registrationForm.valid" 
                    class="register-form__button" 
                    color="primary"
                    >
                    Войти
                </button>
            </div>
        </form>
    </mat-card>
</div>
